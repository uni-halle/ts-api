name: Test

on:
  - push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Create and start virtual environment
      run: |
        python -m venv venv
        source venv/bin/activate

    - name: Install requirements
      run: pip install -r requirements.txt

    - name: Run pytest
      run: |
        mkdir -p artifacts
        pytest --junitxml=artifacts/junit-report.xml

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Junit Report
        path: artifacts/junit-report.xml
        retention-days: 14
  test-real-model:
    runs-on: ubuntu-latest
    env:
      TSAPI_REAL_MODEL_TESTS: "1"
      TSAPI_TEST_MODEL: tiny
      TSAPI_TEST_MODEL_DIR: ${{ github.workspace }}/.cache/models
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Cache Whisper model
      uses: actions/cache@v4
      with:
        path: .cache/models
        key: whisper-model-tiny-${{ hashFiles('requirements.txt') }}

    - name: Install requirements
      run: pip install -r requirements.txt

    - name: Run tests with the real model
      run: |
        mkdir -p artifacts
        pytest test/TestRealModel.py -v --junitxml=artifacts/junit-real-model.xml

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Junit Report real model
        path: artifacts/junit-real-model.xml
        retention-days: 14
