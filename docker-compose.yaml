services:
  ts-api:
    # image: ts-api:local
    build: .
    restart: on-failure
    ports:
      - 5000:5000
    volumes:
      - data:/home/python/ts-api/data
    environment:
      - log=debug
      # CPU settings, use the cuda_gpu branch for Nvidia GPUs
      - whisper_model=large-v3-turbo
      - whisper_device=cpu
      - whisper_compute_type=int8
      - whisper_cpu_threads=23
      - whisper_use_vad=true
      - subtitle_max_length=80
      - parallel_workers=1
      - parallel_downloads=3
      # Hosts files may be downloaded from, e.g. opencast.example.org
      - allowed_download_hosts=${allowed_download_hosts:-}
      # No defaults, set them e.g. in a .env file next to this file
      - login_username=${login_username:?login_username has to be set}
      - login_password=${login_password:?login_password has to be set}

volumes:
  data:
